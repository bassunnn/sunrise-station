- type: entity
  name: shower
  id: ShowerEmpty
  suffix: Empty
  description: It's just shower.
  placement:
    mode: SnapgridCenter
  components:
  - type: Shower
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Sunrise/Entities/Structures/Furniture/shower.rsi
    layers:
    - state: shower
      map: [Enum.ShowerVisualsLayers.Base]
    - state: shower_running
      map: [Enum.ShowerVisualsLayers.Water]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      Enum.ShowerVisuals.Working:
        Enum.ShowerVisualsLayers.Water:
          True: { visible: true }
          False: { visible: false }
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink-fill-
    solutionName: drainBuffer
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 100
      tank:
        maxVol: 500
  - type: SolutionRegeneration
    solution: tank
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: Drain
    autoDrain: false
  - type: DumpableSolution
    solution: drainBuffer
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak

- type: entity
  id: Shower
  suffix: Water
  description: It's shower with water.
  parent: ShowerEmpty
  components:
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 100
      tank:
        maxVol: 500
        reagents:
        - ReagentId: Water
          Quantity: 500

